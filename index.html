
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>18 urodziny Oli💙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
             margin: 0;
    min-height: 100vh;

    background-image: url("tlo.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: white;
    font-family: Georgia, serif;
    text-align: center;
        }

        header {
            padding: 65px 20px 40px;
        }

        .subtitle {
            font-family: Arial, sans-serif;
            letter-spacing: 5px;
            font-size: 11px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(38px, 8vw, 65px);
            font-weight: normal;
            margin: 25px 0 10px;
        }

        .date {
            font-size: 16px;
            letter-spacing: 3px;
        }

        .description {
            max-width: 450px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.8;
            font-size: 17px;
        }

        .upload-button {
            display: inline-block;
            padding: 16px 28px;
            background: white;
            color: black;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
        }

        .upload-button:hover {
            background: #78645a;
        }

        section {
            padding: 25px 20px 60px;
        }

        h2 {
            font-weight: normal;
            font-size: 30px;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            max-width: 900px;
            margin: 30px auto;
        }

        #gallery img, #gallery video {
           max-width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #e9dfd6;
        }

        #status {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 20px;
        }

        footer {
            padding: 25px;
            font-size: 13px;
        }

        @media (min-width: 650px) {
            #gallery {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
 .photo-card {
  display: inline-block;
  margin: 12px;
  text-align: center;
  vertical-align: top;
}

.photo-card img {
  width: 220px;
  max-width: 90vw;
  border-radius: 12px;
  display: block;
  margin-bottom: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
}

.reactions {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.reaction-btn {
  border: none;
  background: rgba(255,255,255,0.9);
  border-radius: 999px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 16px;
  transition: 0.2s ease;
}

.reaction-btn:hover {
  transform: scale(1.08);
  background: #ffffff;
}

.reaction-btn.active {
  background: #f5e6ea;
  box-shadow: 0 0 0 2px #d7b8c2 inset;
}
    </style>
</head>

<body>

    <header>
        

        <h1>18 urodziny Oli💙</h1>

        <div class="date">21.11.2026</div>

        <p class="description">
            Uchwyć cudowne chwile ♡<br>
            Dodaj swoje zdjęcia oraz filmy z tej nocy
            i stwórzmy razem wspomnienia,
            do których będziemy wracać.
        </p>

        <label for="photoInput" class="upload-button">
            DODAJ ZDJĘCIA I FILMY
        </label>

        <input
            type="file"
            id="photoInput"
            accept="image/*,video/*"
            multiple
            hidden
        >

        <p id="status">
            Wybierz zdjęcia lub filmy, aby zobaczyć podgląd.
        </p>
    </header>

    <section>
        
<h2>Wspomnienia z 21.11.2026</h2>
        
        <div id="gallery"></div>
    </section>

    <footer>
        Made with fun ♡
    </footer>

    <script>
       const photoInput = document.getElementById("photoInput");
const gallery = document.getElementById("gallery");
const status = document.getElementById("status");
     async function loadGallery() {
try {
const response = await fetch(
"https://urodziny-oli-galeria.dola71458.workers.dev/zdjecia"
);

if (!response.ok) throw new Error("Błąd pobierania");

const photos = await response.json();
gallery.innerHTML = "";

photos.forEach(photo => {
if (photo.url.match(/\.(mp4|mov|webm)(\?|$)/i)) {
const video = document.createElement("video");
video.src = photo.url;
video.controls = true;
video.playsInline = true;
gallery.appendChild(video);
} else {

const card = document.createElement("div");
card.className = "photo-card";

const img = document.createElement("img");
img.src = photo.url;
img.alt = "Wspomnienia z 18. urodzin Oli";

const photoId = photo.public_id || photo.url;
const reactionBar = createReactionBar(photoId);

card.appendChild(img);
card.appendChild(reactionBar);
gallery.appendChild(card);

}
});
} catch (error) {
console.error("Nie udało się wczytać galerii:", error);
}
}

loadGallery();   

photoInput.addEventListener("change", async function () {
    const files = Array.from(photoInput.files);

    if (files.length === 0) {
        status.textContent = "Nie wybrano plików.";
        return;
    }

    status.textContent = "Trwa wysyłanie zdjęć...";
    let uploaded = 0;

    for (const file of files) {
        if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
            continue;
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "urodziny_oli_18");
        formData.append("tags", "urodziny_oli_18");

        try {
            const response = await fetch(
                "https://api.cloudinary.com/v1_1/kgr9uh8j/auto/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

            if (!response.ok) {
                throw new Error("Błąd wysyłania");
            }

            const data = await response.json();

            const image = document.createElement("img");
            image.src = data.secure_url;
            image.alt = "Zdjęcie z 18. urodzin Oli";
            gallery.appendChild(image);

            uploaded++;
            status.textContent = `Wysłano ${uploaded} z ${files.length} zdjęć.`;
        } catch (error) {
            status.textContent = "Nie udało się wysłać jednego ze zdjęć.";
        }
    }

    if (uploaded > 0) {
        status.textContent = `Gotowe! Wysłano ${uploaded} zdjęć. ❤️`;
    }
});
    </script>


<style>
  #photoViewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.94);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }

  #photoViewer.open {
    display: flex;
  }

  #viewerImage {
    max-width: 90vw;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 8px;
  }

  .viewerControls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
  }

  .viewerControls button,
  #downloadPhoto,
  #closeViewer {
    background: #fff;
    color: #102f35;
    border: 0;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
  }

  #closeViewer {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 24px;
  }

  #gallery img {
    cursor: pointer;
  }
#gallery .reactions {
  display: none;
}

#photoViewer .reactions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0;
}
    
/* Przewijanie podglądu zdjęcia */
#photoViewer.open {
  overflow-y: auto;
  justify-content: flex-start;
  padding: 20px 12px 50px;
  box-sizing: border-box;
}

/* Zdjęcie nie zajmuje całego ekranu */
#viewerImage {
  max-height: 48vh;
  max-width: 95%;
  object-fit: contain;
  flex-shrink: 0;
}

/* Sekcja komentarzy */
#photoComments {
  width: min(92%, 420px);
  margin: 18px auto 30px;
  padding: 15px;
  background: rgba(255, 255, 255, 0.09);
  border-radius: 15px;
  color: white;
  text-align: center;
  flex-shrink: 0;
}

/* Pola jedno pod drugim */
#commentForm {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#commentNickname,
#commentText {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  background: white;
  color: black;
}

#commentText {
  min-height: 80px;
  resize: vertical;
}

#commentForm button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #f4dbe2;

  font-size: 16px;
  cursor: pointer;

#commentStatus {
  margin-top: 10px;

</style>

<div id="photoViewer" role="dialog" aria-label="Podgląd zdjęcia">
  <button id="closeViewer" type="button">×</button>
  <img id="viewerImage" alt="Zdjęcie z urodzin Oli">

  <div class="viewerControls">
    <button id="previousPhoto" type="button">❮</button>
    <a id="downloadPhoto" href="#" target="_blank" rel="noopener">
      Pobierz zdjęcie
    </a>
    <button id="nextPhoto" type="button">❯</button>
  </div>
    
<div id="photoComments">
  <h3>💬 Komentarze</h3>

  <div id="commentsList"></div>

  <form id="commentForm">
    <input
      id="commentNickname"
      type="text"
      placeholder="Twoje imię lub pseudonim"
      maxlength="30"
      required
    >

    <textarea
      id="commentText"
      placeholder="Napisz komentarz..."
      maxlength="500"
      required
    ></textarea>

    <button type="submit">
      Dodaj komentarz ❤️
    </button>
  </form>

  <p id="commentStatus"></p>
</div>

</div>

<script>
(() => {
  const gallery = document.getElementById("gallery");
  const viewer = document.getElementById("photoViewer");
  const image = document.getElementById("viewerImage");
  const download = document.getElementById("downloadPhoto");

  let currentIndex = 0;

  function photos() {
    return Array.from(gallery.querySelectorAll("img"));
  }

  
const commentsApi =
  "https://urodziny-oli-galeria.dola71458.workers.dev/komentarze";

const commentsList = document.getElementById("commentsList");
const commentForm = document.getElementById("commentForm");
const commentStatus = document.getElementById("commentStatus");

async function loadPhotoComments(photoUrl) {
  commentsList.textContent = "Ładowanie komentarzy...";
  commentStatus.textContent = "";

  try {
    const response = await fetch(
      commentsApi + "?photo=" + encodeURIComponent(photoUrl)
    );

    if (!response.ok) throw new Error("Błąd pobierania");

    const comments = await response.json();

    if (image.src !== photoUrl) return;

    commentsList.replaceChildren();

    if (!comments.length) {
      commentsList.textContent =
        "Brak komentarzy. Napisz pierwszy! ❤️";
      return;
    }

    comments.forEach(item => {
      const box = document.createElement("div");
      box.style.margin = "12px 0";
      box.style.padding = "10px";
      box.style.background = "rgba(255,255,255,0.12)";
      box.style.borderRadius = "10px";

      const name = document.createElement("strong");
      name.textContent = item.nickname;

      const message = document.createElement("p");
      message.textContent = item.comment;
      message.style.whiteSpace = "pre-wrap";

      box.append(name, message);
      commentsList.appendChild(box);
    });
  } catch (error) {
    commentsList.textContent =
      "Nie udało się pobrać komentarzy.";
  }
}

commentForm.addEventListener("submit", async event => {
  event.preventDefault();

  const nickname =
    document.getElementById("commentNickname").value.trim();

  const comment =
    document.getElementById("commentText").value.trim();

  const photo = image.src;

  if (!nickname || !comment) return;

  const button = commentForm.querySelector("button");
  button.disabled = true;
  commentStatus.textContent = "Wysyłanie...";

  try {
    const response = await fetch(commentsApi, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        photo,
        nickname,
        comment
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Błąd wysyłania");
    }

    document.getElementById("commentText").value = "";
    commentStatus.textContent = "Komentarz dodany! ❤️";

    await loadPhotoComments(photo);
  } catch (error) {
    commentStatus.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

    function showPhoto(index) {
    const items = photos();
    if (!items.length) return;

    currentIndex = (index + items.length) % items.length;
    const src = items[currentIndex].src;

    image.src = src;
      loadPhotoComments(src);

    const previousBar = viewer.querySelector(".reactions");

    if (previousBar && previousBar._originalCard) {
      previousBar._originalCard.appendChild(previousBar);
    }

    const currentCard = items[currentIndex].closest(".photo-card");
    const reactionBar = currentCard?.querySelector(".reactions");
    const controls = viewer.querySelector(".viewerControls");

    if (reactionBar && controls) {
      reactionBar._originalCard = currentCard;
      viewer.insertBefore(reactionBar, controls);
    }

    // Cloudinary pozwala wymusić pobranie pliku.
    if (src.includes("res.cloudinary.com/")) {
      download.href = src.replace(
        "/image/upload/",
        "/image/upload/fl_attachment/"
      );
    } else {
      download.href = src;
    }

    viewer.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closePhoto() {
    viewer.classList.remove("open");
    document.body.style.overflow = "";
  }

  gallery.addEventListener("click", (event) => {
    if (event.target.tagName !== "IMG") return;
    showPhoto(photos().indexOf(event.target));
  });

  document.getElementById("previousPhoto")
    .addEventListener("click", () => showPhoto(currentIndex - 1));

  document.getElementById("nextPhoto")
    .addEventListener("click", () => showPhoto(currentIndex + 1));

  document.getElementById("closeViewer")
    .addEventListener("click", closePhoto);

  viewer.addEventListener("click", (event) => {
    if (event.target === viewer) closePhoto();
  });

  document.addEventListener("keydown", (event) => {
    if (!viewer.classList.contains("open")) return;

    if (event.key === "Escape") closePhoto();
    if (event.key === "ArrowRight") showPhoto(currentIndex + 1);
    if (event.key === "ArrowLeft") showPhoto(currentIndex - 1);
  });
})();
</script>


<script>

function createReactionBar(photoId) {
  const reactions = ["❤️", "😍", "😂", "🥹", "🔥"];
  const wrapper = document.createElement("div");
  wrapper.className = "reactions";

  const api = "https://urodziny-oli-galeria.dola71458.workers.dev/reakcje";
  const visitorKey = "ola_visitor_id";

  let visitor = localStorage.getItem(visitorKey);
  if (!visitor || !/^[0-9a-f-]{36}$/i.test(visitor)) {
    visitor = crypto.randomUUID();
    localStorage.setItem(visitorKey, visitor);
  }

  const buttons = {};

  reactions.forEach(emoji => {
    const btn = document.createElement("button");
    btn.className = "reaction-btn";
    btn.type = "button";
    btn.textContent = `${emoji} 0`;
    buttons[emoji] = btn;
    wrapper.appendChild(btn);

    btn.addEventListener("click", async () => {
      btn.disabled = true;

      try {
        const response = await fetch(api, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            photo: photoId,
            emoji: emoji,
            visitor: visitor
          })
        });

        if (!response.ok) throw new Error("Błąd zapisu");

        btn.classList.add("active");
        await loadCounts();
      } catch (error) {
        alert("Nie udało się zapisać reakcji. Spróbuj ponownie.");
      } finally {
        btn.disabled = false;
      }
    });
  });

  async function loadCounts() {
    try {
      const response = await fetch(
        `${api}?photo=${encodeURIComponent(photoId)}`
      );

      if (!response.ok) throw new Error("Błąd odczytu");

      const counts = await response.json();

      reactions.forEach(emoji => {
        buttons[emoji].textContent = `${emoji} ${counts[emoji] || 0}`;
      });
    } catch (error) {
      console.error("Nie udało się pobrać reakcji:", error);
    }
  }

  loadCounts();
  return wrapper;
}

</script>
