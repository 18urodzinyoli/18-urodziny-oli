
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>18 urodziny Oli💙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
             margin: 0;
    min-height: 100vh;

    background-image: url("tlo.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: white;
    font-family: Georgia, serif;
    text-align: center;
        }

        header {
            padding: 65px 20px 40px;
        }

        .subtitle {
            font-family: Arial, sans-serif;
            letter-spacing: 5px;
            font-size: 11px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(38px, 8vw, 65px);
            font-weight: normal;
            margin: 25px 0 10px;
        }

        .date {
            font-size: 16px;
            letter-spacing: 3px;
        }

        .description {
            max-width: 450px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.8;
            font-size: 17px;
        }

        .upload-button {
            display: inline-block;
            padding: 16px 28px;
            background: white;
            color: black;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
        }

        .upload-button:hover {
            background: #78645a;
        }

        section {
            padding: 25px 20px 60px;
        }

        h2 {
            font-weight: normal;
            font-size: 30px;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            max-width: 900px;
            margin: 30px auto;
        }

        #gallery img, #gallery video {
           max-width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #e9dfd6;
        }

        #status {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 20px;
        }

        footer {
            padding: 25px;
            font-size: 13px;
        }

        @media (min-width: 650px) {
            #gallery {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>

    <header>
        

        <h1>18 urodziny Oli💙</h1>

        <div class="date">21.11.2026</div>

        <p class="description">
            Uchwyć cudowne chwile ♡<br>
            Dodaj swoje zdjęcia oraz filmy z tej nocy
            i stwórzmy razem wspomnienia,
            do których będziemy wracać.
        </p>

        <label for="photoInput" class="upload-button">
            DODAJ ZDJĘCIA I FILMY
        </label>

        <input
            type="file"
            id="photoInput"
            accept="image/*,video/*"
            multiple
            hidden
        >

        <p id="status">
            Wybierz zdjęcia lub filmy, aby zobaczyć podgląd.
        </p>
    </header>

    <section>
        
<h2>Wspomnienia z 21.11.2026</h2>
        
        <div id="gallery"></div>
    </section>

    <footer>
        Made with fun ♡
    </footer>

    <script>
       const photoInput = document.getElementById("photoInput");
const gallery = document.getElementById("gallery");
const status = document.getElementById("status");
     async function loadGallery() {
try {
const response = await fetch(
"https://urodziny-oli-galeria.dola71458.workers.dev/zdjecia"
);

if (!response.ok) throw new Error("Błąd pobierania");

const photos = await response.json();
gallery.innerHTML = "";

photos.forEach(photo => {
if (photo.url.match(/\.(mp4|mov|webm)(\?|$)/i)) {
const video = document.createElement("video");
video.src = photo.url;
video.controls = true;
video.playsInline = true;
gallery.appendChild(video);
} else {
const img = document.createElement("img");
img.src = photo.url;
img.alt = "Wspomnienia z 18. urodzin Oli";
gallery.appendChild(img);
}
});
} catch (error) {
console.error("Nie udało się wczytać galerii:", error);
}
}

loadGallery();   

photoInput.addEventListener("change", async function () {
    const files = Array.from(photoInput.files);

    if (files.length === 0) {
        status.textContent = "Nie wybrano plików.";
        return;
    }

    status.textContent = "Trwa wysyłanie zdjęć...";
    let uploaded = 0;

    for (const file of files) {
        if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
            continue;
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "urodziny_oli_18");
        formData.append("tags", "urodziny_oli_18");

        try {
            const response = await fetch(
                "https://api.cloudinary.com/v1_1/kgr9uh8j/auto/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

            if (!response.ok) {
                throw new Error("Błąd wysyłania");
            }

            const data = await response.json();

            const image = document.createElement("img");
            image.src = data.secure_url;
            image.alt = "Zdjęcie z 18. urodzin Oli";
            gallery.appendChild(image);

            uploaded++;
            status.textContent = `Wysłano ${uploaded} z ${files.length} zdjęć.`;
        } catch (error) {
            status.textContent = "Nie udało się wysłać jednego ze zdjęć.";
        }
    }

    if (uploaded > 0) {
        status.textContent = `Gotowe! Wysłano ${uploaded} zdjęć. ❤️`;
    }
});
    </script>


<style>
  #photoViewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.94);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }

  #photoViewer.open {
    display: flex;
  }

  #viewerImage {
    max-width: 90vw;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 8px;
  }

  .viewerControls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
  }

  .viewerControls button,
  #downloadPhoto,
  #closeViewer {
    background: #fff;
    color: #102f35;
    border: 0;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
  }

  #closeViewer {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 24px;
  }

  #gallery img {
    cursor: pointer;
  }
</style>

<div id="photoViewer" role="dialog" aria-label="Podgląd zdjęcia">
  <button id="closeViewer" type="button">×</button>
  <img id="viewerImage" alt="Zdjęcie z urodzin Oli">

  <div class="viewerControls">
    <button id="previousPhoto" type="button">❮</button>
    <a id="downloadPhoto" href="#" target="_blank" rel="noopener">
      Pobierz zdjęcie
    </a>
    <button id="nextPhoto" type="button">❯</button>
  </div>
</div>

<script>
(() => {
  const gallery = document.getElementById("gallery");
  const viewer = document.getElementById("photoViewer");
  const image = document.getElementById("viewerImage");
  const download = document.getElementById("downloadPhoto");

  let currentIndex = 0;

  function photos() {
    return Array.from(gallery.querySelectorAll("img"));
  }

  function showPhoto(index) {
    const items = photos();
    if (!items.length) return;

    currentIndex = (index + items.length) % items.length;
    const src = items[currentIndex].src;

    image.src = src;

    // Cloudinary pozwala wymusić pobranie pliku.
    if (src.includes("res.cloudinary.com/")) {
      download.href = src.replace(
        "/image/upload/",
        "/image/upload/fl_attachment/"
      );
    } else {
      download.href = src;
    }

    viewer.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closePhoto() {
    viewer.classList.remove("open");
    document.body.style.overflow = "";
  }

  gallery.addEventListener("click", (event) => {
    if (event.target.tagName !== "IMG") return;
    showPhoto(photos().indexOf(event.target));
  });

  document.getElementById("previousPhoto")
    .addEventListener("click", () => showPhoto(currentIndex - 1));

  document.getElementById("nextPhoto")
    .addEventListener("click", () => showPhoto(currentIndex + 1));

  document.getElementById("closeViewer")
    .addEventListener("click", closePhoto);

  viewer.addEventListener("click", (event) => {
    if (event.target === viewer) closePhoto();
  });

  document.addEventListener("keydown", (event) => {
    if (!viewer.classList.contains("open")) return;

    if (event.key === "Escape") closePhoto();
    if (event.key === "ArrowRight") showPhoto(currentIndex + 1);
    if (event.key === "ArrowLeft") showPhoto(currentIndex - 1);
  });
})();
</script>

</body>
</html>
