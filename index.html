
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>18. urodziny Oli</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
             margin: 0;
    min-height: 100vh;

    background-image: url("tlo.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: white;
    font-family: Georgia, serif;
    text-align: center;
        }

        header {
            padding: 65px 20px 40px;
        }

        .subtitle {
            font-family: Arial, sans-serif;
            letter-spacing: 5px;
            font-size: 11px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(38px, 8vw, 65px);
            font-weight: normal;
            margin: 25px 0 10px;
        }

        .date {
            font-size: 16px;
            letter-spacing: 3px;
        }

        .description {
            max-width: 450px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.8;
            font-size: 17px;
        }

        .upload-button {
            display: inline-block;
            padding: 16px 28px;
            background: white;
            color: black;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
        }

        .upload-button:hover {
            background: #78645a;
        }

        section {
            padding: 25px 20px 60px;
        }

        h2 {
            font-weight: normal;
            font-size: 30px;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            max-width: 900px;
            margin: 30px auto;
        }

        #gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #e9dfd6;
        }

        #status {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 20px;
        }

        footer {
            padding: 25px;
            font-size: 13px;
        }

        @media (min-width: 650px) {
            #gallery {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>

    <header>
        

        <h1>18 urodziny Oli</h1>

        <div class="date">21.11.2026</div>

        <p class="description">
            Uchwyć cudowne chwile ♡<br>
            Dodaj swoje zdjęcia z tej nocy
            i stwórzmy razem wspomnienia,
            do których będziemy wracać.
        </p>

        <label for="photoInput" class="upload-button">
            DODAJ ZDJĘCIA
        </label>

        <input
            type="file"
            id="photoInput"
            accept="image/*"
            multiple
            hidden
        >

        <p id="status">
            Wybierz zdjęcia, aby zobaczyć podgląd.
        </p>
    </header>

    <section>
        
<h2>Wspomnienia z 21.11.2026</h2>
        
        <div id="gallery"></div>
    </section>

    <footer>
        Made with love ♡
    </footer>

    <script>
        const photoInput = document.getElementById("photoInput");
        const gallery = document.getElementById("gallery");
        const status = document.getElementById("status");

        photoInput.addEventListener("change", function () {
            gallery.innerHTML = "";

            const files = Array.from(photoInput.files);

            if (files.length === 0) {
                status.textContent = "Nie wybrano zdjęć.";
                return;
            }

            files.forEach(function (file) {
                if (!file.type.startsWith("image/")) {
                    return;
                }

                const image = document.createElement("img");
                image.alt = "Podgląd zdjęcia";

                const reader = new FileReader();

                reader.onload = function (event) {
                    image.src = event.target.result;
                };

                reader.readAsDataURL(file);
                gallery.appendChild(image);
            });

            status.textContent =
                "Podgląd: " + files.length +
                " wybranych plików. To jeszcze nie jest wysyłka.";
        });
    </script>

</body>
</html>
